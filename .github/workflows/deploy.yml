name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ] # Change to main if your default branch is main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Safe baseline for an older Quasar project

      - name: Install Dependencies
        run: npm ci

      - name: Build Quasar PWA
        run: npx quasar build -m pwa

      # OPTIONAL: Uncomment the line below if you chose Option B for routing
      # - name: Fix GitHub Pages 404 for SPA
      #   run: cp dist/pwa/index.html dist/pwa/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pwa
